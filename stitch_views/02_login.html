<!DOCTYPE html>

<html class="h-full" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Puente Tierra - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400..700;1,400..700&amp;family=Inter:wght@400..700&amp;family=Manrope:wght@400..700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-variant": "#e3e2df",
                        "surface-container-highest": "#e3e2df",
                        "on-error": "#ffffff",
                        "error-container": "#ffdad6",
                        "on-surface": "#1b1c1a",
                        "outline-variant": "#e0c0b4",
                        "surface": "#faf9f5",
                        "on-primary": "#ffffff",
                        "tertiary-fixed": "#ffddb4",
                        "tertiary-container": "#9c6a1a",
                        "on-tertiary-fixed": "#291800",
                        "on-tertiary-fixed-variant": "#633f00",
                        "surface-tint": "#a73a00",
                        "secondary-fixed": "#a3f69c",
                        "on-background": "#1b1c1a",
                        "on-primary-fixed": "#370e00",
                        "primary-container": "#c74e14",
                        "on-secondary-fixed": "#002204",
                        "secondary-container": "#a0f499",
                        "on-secondary-fixed-variant": "#005312",
                        "on-error-container": "#93000a",
                        "on-secondary": "#ffffff",
                        "on-tertiary": "#ffffff",
                        "primary-fixed": "#ffdbce",
                        "secondary": "#1b6d24",
                        "tertiary-fixed-dim": "#f9bb65",
                        "inverse-on-surface": "#f2f1ed",
                        "primary-fixed-dim": "#ffb599",
                        "primary": "#a33900",
                        "surface-container": "#efeeea",
                        "surface-bright": "#faf9f5",
                        "background": "#faf9f5",
                        "error": "#ba1a1a",
                        "on-primary-fixed-variant": "#7f2a00",
                        "surface-container-high": "#e9e8e4",
                        "surface-dim": "#dbdad6",
                        "surface-container-lowest": "#ffffff",
                        "on-secondary-container": "#207128",
                        "outline": "#8c7168",
                        "on-tertiary-container": "#fffbff",
                        "secondary-fixed-dim": "#87d982",
                        "surface-container-low": "#f4f4f0",
                        "on-surface-variant": "#584239",
                        "inverse-primary": "#ffb599",
                        "on-primary-container": "#fffbff",
                        "tertiary": "#7f5300",
                        "inverse-surface": "#2f312e"
                    },
                    "borderRadius": {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Noto Serif"],
                        "body": ["Inter"],
                        "label": ["Manrope"]
                    }
                },
            },
        }
    </script>
<style>
        body { font-family: 'Inter', sans-serif; }
        .font-headline { font-family: 'Noto Serif', serif; }
        .font-label { font-family: 'Manrope', sans-serif; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-surface text-on-surface h-full flex flex-col antialiased">
<!-- Main Content Canvas (Transactional - No Navigation Shells) -->
<main class="flex-1 flex flex-col lg:flex-row w-full h-full">
<!-- Left Hero Image Section (Hidden on mobile) -->
<div class="hidden lg:flex lg:w-1/2 relative bg-surface-container-low overflow-hidden">
<img alt="Agricultural fields" class="absolute inset-0 w-full h-full object-cover" data-alt="Wide shot of lush, undulating agricultural fields at sunrise, soft golden light kissing the green terraced soil, high-end editorial farming photography" src="https://lh3.googleusercontent.com/aida-public/AB6AXuB2T6xiU34hH666UGKEANjVphyAiXDkhuuiRPbj-s4cPReZNtK_WyXf1ucwY-4aHHmRPNDJxH5vnYjUX5NqlDgw5pMXm9tqENqIQz3wp7wD6fGuZH-NlFi_FYs6-5BqI0lYSfW54_Yxnp6MEBEnoU8eNRZDFunN_IlWoBe-lcNrrlRYm7v_jWi2sMIzCgSc0GolSysugKHqcOZ8SbwMCrmlR6J5Mb4AXvdVjv4yHb172y6N3cniuDc1lm3JlUU7Eg4Q_NtFDkOpg_w"/>
<!-- Glassmorphism Overlay for text -->
<div class="absolute bottom-12 left-12 right-12 p-8 rounded-lg bg-surface/20 backdrop-blur-xl border border-surface-container-lowest/30 shadow-[0_24px_40px_-8px_rgba(88,66,57,0.15)]">
<h2 class="font-headline text-4xl font-bold text-surface-container-lowest mb-4 drop-shadow-md">Cultivando el Futuro</h2>
<p class="font-body text-lg text-surface-container-lowest/90 max-w-md drop-shadow-sm">Gestión agrícola avanzada, con la precisión que la tierra merece.</p>
</div>
</div>
<!-- Right Form Section -->
<div class="flex-1 flex flex-col justify-center px-6 py-12 lg:px-24 bg-surface relative z-10">
<div class="w-full max-w-md mx-auto space-y-10">
<!-- Brand Header -->
<div class="text-center sm:text-left space-y-2">
<img alt="Puente Tierra Logo" class="mx-auto sm:mx-0 h-28 w-auto mb-4" src="https://lh3.googleusercontent.com/aida/ADBb0ujCZOvCUMSlD8k2tpmChReGh8cQsdGkinIFgASLEtFZ9Gwla2NbCR9RvU5GJpjTjm4k106gTXWB6YTyg-RbV246yjhNl4KaOU9m1Vmtdsu2lEYLHIF0Carx3ZVn-AFpbgJQdyFKMojkkAwiqg4OdY1u6CXTZEtk3UxJGfQl_KBOIAXVpladVr8EXWZqFz3VTIJ_eRF4r3Jxqv8hBiJL-IvCOujHjZTF_hExulBwo7LtcqPalrTNPU3wcU4kDbCNveM-eHEPYkDorQ"/>
<p class="font-body text-on-surface-variant text-lg">Bienvenido de nuevo a su gestión rural.</p>
</div>
<!-- Login Form -->
<form action="#" class="space-y-6" method="POST">
<div class="space-y-5">
<!-- Email Field -->
<div>
<label class="block font-label text-sm font-semibold text-on-surface-variant mb-2 ml-1" for="email">Correo Electrónico</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline" data-icon="mail">mail</span>
</div>
<input autocomplete="email" class="block w-full pl-12 pr-4 py-4 bg-surface-container-high border-transparent rounded-md font-body text-on-surface placeholder:text-outline focus:bg-primary-fixed focus:ring-0 focus:border-transparent transition-colors shadow-[inset_0_2px_4px_rgba(0,0,0,0.02)]" id="email" name="email" placeholder="ejemplo@finca.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div>
<div class="flex items-center justify-between mb-2 ml-1">
<label class="block font-label text-sm font-semibold text-on-surface-variant" for="password">Contraseña</label>
<a class="font-label text-sm font-semibold text-primary hover:text-primary-container transition-colors" href="#">¿Olvidó su contraseña?</a>
</div>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline" data-icon="lock">lock</span>
</div>
<input autocomplete="current-password" class="block w-full pl-12 pr-4 py-4 bg-surface-container-high border-transparent rounded-md font-body text-on-surface placeholder:text-outline focus:bg-primary-fixed focus:ring-0 focus:border-transparent transition-colors shadow-[inset_0_2px_4px_rgba(0,0,0,0.02)]" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
</div>
<!-- Actions Area -->
<div class="pt-4 space-y-4">
<!-- Primary Button -->
<button class="w-full flex justify-center py-4 px-6 border border-transparent rounded-xl shadow-[0_16px_32px_-8px_rgba(163,57,0,0.25)] font-label text-base font-semibold text-on-primary bg-gradient-to-r from-primary to-primary-container hover:opacity-90 transition-opacity focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary" type="submit">
                            Ingresar
                        </button>
<!-- Biometric Quick Login Option -->
<div class="relative py-4">
<div aria-hidden="true" class="absolute inset-0 flex items-center">
<div class="w-full border-t border-surface-container-highest"></div>
</div>
<div class="relative flex justify-center">
<span class="px-4 bg-surface font-label text-sm text-on-surface-variant">o ingreso rápido</span>
</div>
</div>
<button class="w-full flex items-center justify-center py-4 px-6 rounded-xl bg-surface-container-highest text-primary font-label text-base font-semibold hover:bg-surface-variant transition-colors focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary" type="button">
<span class="material-symbols-outlined mr-2" data-icon="fingerprint" data-weight="fill" style="font-variation-settings: 'FILL' 1;">fingerprint</span>
                            Usar Biometría
                        </button>
</div>
</form>
<!-- Registration Prompt -->
<div class="text-center pt-6 pb-12">
<p class="font-body text-on-surface-variant">
                        ¿No tienes una cuenta? 
                        <a class="font-label font-bold text-primary hover:text-primary-container transition-colors ml-1" href="#">Crear Cuenta</a>
</p>
</div>
</div>
</div>
</main>
</body></html>
